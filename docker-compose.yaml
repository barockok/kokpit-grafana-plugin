services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v3.2.1
    ports:
      - 9090:9090
    volumes:
      - ./test-data/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=1h'
